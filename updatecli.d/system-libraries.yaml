---
name: System Libraries Updates

sources:
  acl:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/acl.git
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/acl.git/tree/"
      compare: "https://git.savannah.gnu.org/cgit/acl.git/diff/?id={new_tag}&id2={old_tag}"

  attr:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/attr.git
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/attr.git/tree/"
      compare: "https://git.savannah.gnu.org/cgit/attr.git/diff/?id={new_tag}&id2={old_tag}"

  libcap:
    kind: gittag
    spec:
      url: git://git.kernel.org/pub/scm/libs/libcap/libcap.git
      versionfilter:
        kind: regex
        pattern: '^libcap-[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: libcap-
      - sort:
          method: semver
    changelog:
      url: "https://git.kernel.org/pub/scm/libs/libcap/libcap.git/tree/"
      compare: "https://git.kernel.org/pub/scm/libs/libcap/libcap.git/diff/?id={new_tag}&id2={old_tag}"

  libmnl:
    kind: gittag
    spec:
      url: git://git.netfilter.org/libmnl
      versionfilter:
        kind: regex
        pattern: '^libmnl-[0-9]+\.[0-9]+\.[0-9]$'
    transformers:
      - trimprefix: libmnl-
      - sort:
          method: semver
    changelog:
      url: "https://git.netfilter.org/libmnl/tree/"
      compare: "https://git.netfilter.org/libmnl/diff/?id={new_tag}&id2={old_tag}"

  libnftnl:
    kind: gittag
    spec:
      url: git://git.netfilter.org/libnftnl
      versionfilter:
        kind: regex
        pattern: '^libnftnl-[0-9]+\.[0-9]+\.[0-9]$'
    transformers:
      - trimprefix: libnftnl-
      - sort:
          method: semver
    changelog:
      url: "https://git.netfilter.org/libnftnl/tree/"
      compare: "https://git.netfilter.org/libnftnl/diff/?id={new_tag}&id2={old_tag}"

  seccomp:
    kind: gittag
    spec:
      url: https://github.com/seccomp/libseccomp.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libffi:
    kind: gittag
    spec:
      url: https://github.com/libffi/libffi.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libaio:
    kind: gittag
    spec:
      url: https://pagure.io/libaio.git
      versionfilter:
        kind: regex
        pattern: '^libaio-0\.3\.[0-9]+$'
    transformers:
      - trimprefix: libaio-
      - sort:
          method: semver
    changelog:
      url: "https://pagure.io/libaio"

  dbus:
    kind: gittag
    spec:
      url: https://gitlab.freedesktop.org/dbus/dbus.git
      versionfilter:
        kind: regex
        # dbus-1.14.5, dbus-1.16.0, ...
        # even minor -> last digit of minor is 0,2,4,6,8
        # odd minor are not stable and should be ignored
        pattern: '^dbus-[0-9]+\.[0-9]*[02468]\.[0-9]+$'
    transformers:
      - trimprefix: dbus-
      - sort:
          method: semver

  expat:
    kind: githubrelease
    spec:
      owner: libexpat
      repository: libexpat
      versionfilter:
        kind: regex
        pattern: '^R_[0-9]+_[0-9]+_[0-9]+$'
    transformers:
      - trimprefix: R_
      - replacer:
          from: '_'
          to: '.'
      - sort:
          method: semver

  popt:
    kind: githubrelease
    spec:
      owner: rpm-software-management
      repository: popt
    transformers:
      - trimprefix: popt-
      - trimsuffix: -release

  libxml2:
    kind: gittag
    spec:
      url: https://gitlab.gnome.org/GNOME/libxml2.git
    transformers:
      - trimprefix: v


  jsonc:
    kind: gittag
    spec:
      url: https://github.com/json-c/json-c.git
      versionfilter:
        kind: regex/semver
        # json-c tags look like: json-c-0.18-20240915
        regex: '^json-c-([0-9]+\.[0-9]+(?:\.[0-9]+)?)-[0-9]{8}$'
        pattern: '*'
    transformers:
      - trimprefix: json-c-
      - findsubmatch:
          # after trimprefix we have: 0.18-20240915
          pattern: '^([0-9]+\.[0-9]+(?:\.[0-9]+)?)-[0-9]{8}$'
          captureindex: 1

  fts:
    kind: gittag
    spec:
      url: https://github.com/pullmoll/musl-fts.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libelf:
    kind: gittag
    spec:
      url: https://github.com/arachsys/libelf.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libiconv:
    kind: shell
    spec:
      command: |
        git ls-remote --refs --tags https://https.git.savannah.gnu.org/git/libiconv.git | grep -v '\^{}' \
        | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+$' \
        | sort -V | tail -n 1
    transformers:
      - trimprefix: v
      - sort:
          method: semver
    changelog:
      url: "https://www.gnu.org/software/libiconv/"

  pcre2:
    kind: githubrelease
    spec:
      owner: PCRE2Project
      repository: pcre2
      versionfilter:
        kind: regex/semver
        regex: '^pcre2-([0-9]+\.[0-9]+)$'
        pattern: '*'
    transformers:
      - trimprefix: pcre2-

  libkcapi:
    kind: gittag
    spec:
      url: https://github.com/smuellerDD/libkcapi.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

targets:
  acl:
    name: acl version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.acl.version
    sourceid: acl

  attr:
    name: attr version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.attr.version
    sourceid: attr

  libcap:
    name: libcap version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libcap.version
    sourceid: libcap

  libmnl:
    name: libmnl version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libmnl.version
    sourceid: libmnl

  libnftnl:
    name: libnftnl version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libnftnl.version
    sourceid: libnftnl

  seccomp:
    name: libseccomp version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libseccomp.version
    sourceid: seccomp

  libffi:
    name: libffi version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libffi.version
    sourceid: libffi

  libaio:
    name: libaio version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libaio.version
    sourceid: libaio

  dbus:
    name: dbus version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.dbus.version
    sourceid: dbus

  expat:
    name: expat version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.expat.version
    sourceid: expat

  popt:
    name: popt version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.popt.version
    sourceid: popt

  libxml2:
    name: libxml2 version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libxml2.version
    sourceid: libxml2

  jsonc:
    name: json-c version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.json-c.version
    sourceid: jsonc

  fts:
    name: musl-fts version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.musl-fts.version
    sourceid: fts

  libelf:
    name: libelf version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libelf.version
    sourceid: libelf

  libiconv:
    name: libiconv version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libiconv.version
    sourceid: libiconv

  pcre2:
    name: pcre2 version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.pcre2.version
    sourceid: pcre2

  libkcapi:
    name: libkcapi version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libkcapi.version
    sourceid: libkcapi
