---
name: Security Tools Updates

sources:
  openssl:
    kind: githubrelease
    spec:
      owner: openssl
      repository: openssl
      versionfilter:
        kind: regex/semver
        # capture group 1 is the semver
        regex: '^openssl-([0-9]+\.[0-9]+\.[0-9]+)$'
        # Restrict to 3.6.x branch; do not auto-bump to 4.x.x (incompatible)
        pattern: '>=3.6.0 <3.7.0'
    transformers:
      - trimprefix: openssl-

  openssh:
    kind: gittag
    spec:
      url: https://github.com/openssh/openssh-portable.git
      versionfilter:
        kind: regex
        pattern: '^V_[0-9]+_[0-9]+_P[0-9]+$'
    transformers:
      - trimprefix: V_
      - replacer: { from: "_P", to: "p" }
      - replacer: { from: "_",  to: "." }
      # IMPORTANT: sort must happen on something sortable.
      # 10.2p1 is not semver, so use lexical/alphanum sort.
      - sort:
          method: alphanum

  sudo:
    kind: githubrelease
    spec:
      owner: sudo-project
      repository: sudo
    transformers:
      - trimprefix: v

  pam:
    kind: gittag
    spec:
      url: https://github.com/linux-pam/linux-pam.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  shadow:
    kind: githubrelease
    spec:
      owner: shadow-maint
      repository: shadow

  cryptsetup:
    kind: gittag
    spec:
      url: https://gitlab.com/cryptsetup/cryptsetup.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

targets:
  openssl:
    name: openssl version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.openssl.version
    sourceid: openssl

  openssh:
    name: openssh version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.openssh.version
    sourceid: openssh

  sudo:
    name: sudo version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.sudo.version
    sourceid: sudo

  pam:
    name: pam version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.pam.version
    sourceid: pam

  shadow:
    name: shadow version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.shadow.version
    sourceid: shadow

  cryptsetup:
    name: cryptsetup version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.cryptsetup.version
    sourceid: cryptsetup
