---
name: Storage Tools Updates


sources:
  lvm2:
    kind: gittag
    spec:
      url: https://gitlab.com/lvmteam/lvm2.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: '^v[0-9]+_[0-9]+_[0-9]+$'
    transformers:
      - trimprefix: v
      - sort:
          method: alphanum
      - replacer:
          from: '_'
          to: '.'

  multipath:
    kind: gittag
    spec:
      url: https://github.com/opensvc/multipath-tools.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: '*'

  e2fsprogs:
    kind: gittag
    spec:
      url: git://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git
      lsremote: true
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'
    changelog:
      url: "https://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git/tree/"
      compare: "https://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git/diff/?id={new_tag}&id2={old_tag}"

  dosfstools:
    kind: gittag
    spec:
      url: https://github.com/dosfstools/dosfstools.git
      lsremote: true
    transformers:
      - trimprefix: v

  parted:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: gittag
    spec:
      url: https://git.savannah.gnu.org/git/parted.git
      lsremote: true
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'
    changelog:
      url: "https://git.savannah.gnu.org/cgit/parted.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/parted.git/diff/?id={new_tag}&id2={old_tag}"

  urcu:
    kind: gittag
    spec:
      url: https://github.com/urcu/userspace-rcu.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libtirpc:
    kind: gittag
    spec:
      # NB: only the unencrypted git:// transport on this host serves these
      # refs; the https endpoint returns 403. If CI blocks outbound port 9418,
      # switch to a `shell`/`releasechecker` source.
      url: git://git.linux-nfs.org/projects/steved/libtirpc.git
      lsremote: true
      versionfilter:
        kind: regex
        # GA only - exclude libtirpc-X-Y-Z-rcN
        pattern: '^libtirpc-[0-9]+-[0-9]+-[0-9]+$'
    transformers:
      - trimprefix: libtirpc-
      - replacer:
          from: '-'
          to: '.'
      - sort:
          method: semver
      - semver:
          constraint: '*'

  nfs-utils:
    kind: gittag
    spec:
      url: git://git.linux-nfs.org/projects/steved/nfs-utils.git
      lsremote: true
      versionfilter:
        kind: regex
        # GA only - exclude nfs-utils-X-Y-Z-rcN
        pattern: '^nfs-utils-[0-9]+-[0-9]+-[0-9]+$'
    transformers:
      - trimprefix: nfs-utils-
      - replacer:
          from: '-'
          to: '.'
      - sort:
          method: semver
      - semver:
          constraint: '*'

targets:
  lvm2:
    name: lvm2 version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.lvm2.version
    sourceid: lvm2

  multipath:
    name: multipath-tools version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.multipath-tools.version
    sourceid: multipath

  e2fsprogs:
    name: e2fsprogs version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.e2fsprogs.version
    sourceid: e2fsprogs

  dosfstools:
    name: dosfstools version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.dosfstools.version
    sourceid: dosfstools

  parted:
    name: parted version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.parted.version
    sourceid: parted

  urcu:
    name: urcu version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.urcu.version
    sourceid: urcu

  libtirpc:
    name: libtirpc version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libtirpc.version
    sourceid: libtirpc

  nfs-utils:
    name: nfs-utils version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.nfs-utils.version
    sourceid: nfs-utils
