---
name: Compression Tools Updates

sources:
  curl:
    kind: githubrelease
    spec:
      owner: curl
      repository: curl
    transformers:
      - trimprefix: curl-
      - replacer:
          from: '_'
          to: '.'

  rsync:
    kind: githubrelease
    spec:
      owner: RsyncProject
      repository: rsync
    transformers:
      - trimprefix: v

  xxhash:
    kind: gittag
    spec:
      url: https://github.com/Cyan4973/xxHash.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  zstd:
    kind: githubrelease
    spec:
      owner: facebook
      repository: zstd
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  lz4:
    kind: gittag
    spec:
      url: https://github.com/lz4/lz4.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  zlib:
    kind: gittag
    spec:
      url: https://github.com/madler/zlib.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  xzutils:
    kind: githubrelease
    spec:
      owner: tukaani-project
      repository: xz
    transformers:
      - trimprefix: v

  gzip:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: shell
    spec:
      command: |
        git ls-remote --refs --tags git://git.git.savannah.gnu.org/gzip.git | grep -v '\^{}' \
        | awk -F/ '{print $NF}' \
        | sort -V | tail -n 1
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/gzip.git/tree/NEWS"

targets:
  curl:
    name: curl version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.curl.version
    sourceid: curl

  rsync:
    name: rsync version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.rsync.version
    sourceid: rsync

  xxhash:
    name: xxhash version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.xxhash.version
    sourceid: xxhash

  zstd:
    name: zstd version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.zstd.version
    sourceid: zstd

  lz4:
    name: lz4 version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.lz4.version
    sourceid: lz4

  zlib:
    name: zlib version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.zlib.version
    sourceid: zlib

  xzutils:
    name: xz version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.xz.version
    sourceid: xzutils

  gzip:
    name: gzip version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.gzip.version
    sourceid: gzip
