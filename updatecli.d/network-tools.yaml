---
name: Network Tools Updates

sources:
  iptables:
    kind: gittag
    spec:
      url: git://git.netfilter.org/iptables
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.netfilter.org/iptables/tree/"
      compare: "https://git.netfilter.org/iptables/diff/?id={new_tag}&id2={old_tag}"

  open_iscsi:
    kind: gittag
    spec:
      url: https://github.com/open-iscsi/open-iscsi.git
      versionfilter:
        kind: semver
        pattern: '*'

  strace:
    kind: gittag
    spec:
      url: https://github.com/strace/strace
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libnl:
    kind: githubrelease
    spec:
      owner: thom311
      repository: libnl
      versionfilter:
        kind: regex
        # GA only - release tags look like libnl3_12_0; exclude prereleases
        pattern: '^libnl[0-9]+_[0-9]+_[0-9]+$'
    transformers:
      - trimprefix: libnl
      - replacer:
          from: '_'
          to: '.'
      - sort:
          method: semver
      - semver:
          constraint: '*'

  libevent:
    kind: githubrelease
    spec:
      owner: libevent
      repository: libevent
      versionfilter:
        kind: regex
        # GA only - release tags look like release-2.1.12-stable
        pattern: '^release-[0-9]+\.[0-9]+\.[0-9]+-stable$'
    transformers:
      - trimprefix: release-
      - trimsuffix: -stable
      - sort:
          method: semver
      - semver:
          constraint: '*'

  keyutils:
    kind: gittag
    spec:
      url: https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git
      versionfilter:
        kind: regex
        pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'
    changelog:
      url: "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/tree/"
      compare: "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/diff/?id={new_tag}&id2={old_tag}"

targets:
  iptables:
    name: iptables version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.iptables.version
    sourceid: iptables

  open_iscsi:
    name: openscsi version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.openscsi.version
    sourceid: open_iscsi

  strace:
    name: strace version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.strace.version
    sourceid: strace

  libnl:
    name: libnl version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libnl.version
    sourceid: libnl

  libevent:
    name: libevent version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libevent.version
    sourceid: libevent

  keyutils:
    name: keyutils version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.keyutils.version
    sourceid: keyutils
