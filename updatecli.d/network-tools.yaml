---
name: Network Tools Updates

sources:
  iptables:
    kind: gittag
    spec:
      url: git://git.netfilter.org/iptables
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.netfilter.org/iptables/tree/"
      compare: "https://git.netfilter.org/iptables/diff/?id={new_tag}&id2={old_tag}"

  open_iscsi:
    kind: gittag
    spec:
      url: https://github.com/open-iscsi/open-iscsi.git
      versionfilter:
        kind: semver
        pattern: '*'

  strace:
    kind: gittag
    spec:
      url: https://github.com/strace/strace
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libnl:
    kind: githubrelease
    spec:
      owner: thom311
      repository: libnl
      versionfilter:
        kind: regex
        # GA only - release tags look like libnl3_12_0; exclude prereleases
        pattern: '^libnl[0-9]+_[0-9]+_[0-9]+$'
    transformers:
      - trimprefix: libnl
      - replacer:
          from: '_'
          to: '.'
      - sort:
          method: semver
      - semver:
          constraint: '*'

  libevent:
    kind: githubrelease
    spec:
      owner: libevent
      repository: libevent
      versionfilter:
        kind: regex
        # GA only - release tags look like release-2.1.12-stable
        pattern: '^release-[0-9]+\.[0-9]+\.[0-9]+-stable$'
    transformers:
      - trimprefix: release-
      - trimsuffix: -stable
      - sort:
          method: semver
      - semver:
          constraint: '*'

  keyutils:
    kind: gittag
    spec:
      url: https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git
      versionfilter:
        kind: regex
        pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'
    changelog:
      url: "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/tree/"
      compare: "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/diff/?id={new_tag}&id2={old_tag}"

  conntrack_tools:
    kind: gittag
    spec:
      url: git://git.netfilter.org/conntrack-tools
      versionfilter:
        kind: regex
        # Skips the svn_t_* tags imported from the old svn history.
        pattern: '^conntrack-tools-[0-9]+\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: conntrack-tools-
      - sort:
          method: semver
    changelog:
      url: "https://git.netfilter.org/conntrack-tools/tree/"
      compare: "https://git.netfilter.org/conntrack-tools/diff/?id={new_tag}&id2={old_tag}"

  libnetfilter_conntrack:
    kind: gittag
    spec:
      url: git://git.netfilter.org/libnetfilter_conntrack
      versionfilter:
        kind: regex
        # Skips the svn_t_* tags imported from the old svn history.
        pattern: '^libnetfilter_conntrack-[0-9]+\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: libnetfilter_conntrack-
      - sort:
          method: semver
    changelog:
      url: "https://git.netfilter.org/libnetfilter_conntrack/tree/"
      compare: "https://git.netfilter.org/libnetfilter_conntrack/diff/?id={new_tag}&id2={old_tag}"

  libnetfilter_cthelper:
    kind: gittag
    spec:
      url: git://git.netfilter.org/libnetfilter_cthelper
      versionfilter:
        kind: regex
        # Skips the svn_t_* tags imported from the old svn history.
        pattern: '^libnetfilter_cthelper-[0-9]+\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: libnetfilter_cthelper-
      - sort:
          method: semver
    changelog:
      url: "https://git.netfilter.org/libnetfilter_cthelper/tree/"
      compare: "https://git.netfilter.org/libnetfilter_cthelper/diff/?id={new_tag}&id2={old_tag}"

  libnetfilter_cttimeout:
    kind: gittag
    spec:
      url: git://git.netfilter.org/libnetfilter_cttimeout
      versionfilter:
        kind: regex
        # Skips the svn_t_* tags imported from the old svn history.
        pattern: '^libnetfilter_cttimeout-[0-9]+\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: libnetfilter_cttimeout-
      - sort:
          method: semver
    changelog:
      url: "https://git.netfilter.org/libnetfilter_cttimeout/tree/"
      compare: "https://git.netfilter.org/libnetfilter_cttimeout/diff/?id={new_tag}&id2={old_tag}"

  libnetfilter_queue:
    kind: gittag
    spec:
      url: git://git.netfilter.org/libnetfilter_queue
      versionfilter:
        kind: regex
        # Skips the svn_t_* tags imported from the old svn history.
        pattern: '^libnetfilter_queue-[0-9]+\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: libnetfilter_queue-
      - sort:
          method: semver
    changelog:
      url: "https://git.netfilter.org/libnetfilter_queue/tree/"
      compare: "https://git.netfilter.org/libnetfilter_queue/diff/?id={new_tag}&id2={old_tag}"

  libnfnetlink:
    kind: gittag
    spec:
      url: git://git.netfilter.org/libnfnetlink
      versionfilter:
        kind: regex
        # Skips the svn_t_* tags imported from the old svn history.
        pattern: '^libnfnetlink-[0-9]+\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: libnfnetlink-
      - sort:
          method: semver
    changelog:
      url: "https://git.netfilter.org/libnfnetlink/tree/"
      compare: "https://git.netfilter.org/libnfnetlink/diff/?id={new_tag}&id2={old_tag}"

targets:
  iptables:
    name: IPTABLES_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: IPTABLES_VERSION
    sourceid: iptables

  open_iscsi:
    name: OPEN_SCSI_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: OPEN_SCSI_VERSION
    sourceid: open_iscsi

  strace:
    name: STRACE_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: STRACE_VERSION
    sourceid: strace

  libnl:
    name: LIBNL_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBNL_VERSION
    sourceid: libnl

  libevent:
    name: LIBEVENT_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBEVENT_VERSION
    sourceid: libevent

  keyutils:
    name: KEYUTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: KEYUTILS_VERSION
    sourceid: keyutils

  conntrack_tools:
    name: CONNTRACK_TOOLS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: CONNTRACK_TOOLS_VERSION
    sourceid: conntrack_tools

  libnetfilter_conntrack:
    name: LIBNETFILTER_CONNTRACK_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBNETFILTER_CONNTRACK_VERSION
    sourceid: libnetfilter_conntrack

  libnetfilter_cthelper:
    name: LIBNETFILTER_CTHELPER_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBNETFILTER_CTHELPER_VERSION
    sourceid: libnetfilter_cthelper

  libnetfilter_cttimeout:
    name: LIBNETFILTER_CTTIMEOUT_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBNETFILTER_CTTIMEOUT_VERSION
    sourceid: libnetfilter_cttimeout

  libnetfilter_queue:
    name: LIBNETFILTER_QUEUE_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBNETFILTER_QUEUE_VERSION
    sourceid: libnetfilter_queue

  libnfnetlink:
    name: LIBNFNETLINK_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBNFNETLINK_VERSION
    sourceid: libnfnetlink
