---
name: Build Tools Updates

sources:
  flex:
    kind: gittag
    spec:
      url: https://github.com/westes/flex.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'

  pkgconfig:
    kind: gittag
    spec:
      url: https://github.com/pkgconf/pkgconf.git
    transformers:
      - trimprefix: pkgconf-
      - sort:
          method: semver
      - semver:
          constraint: '*'

  bison:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: shell
    spec:
      command: |
        git ls-remote --refs --tags https://https.git.savannah.gnu.org/git/bison.git | grep -v '\^{}' \
        | awk -F/ '{print $NF}' \
        | sort -V |tail -n 1
    transformers:
      - trimprefix: v
      - sort:
          method: semver
    changelog:
      url: "https://git.savannah.gnu.org/cgit/bison.git/tree/NEWS"

  autoconf:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: shell
    spec:
      command: |
        git ls-remote --refs --tags git://git.savannah.gnu.org/autoconf.git | grep -v '\^{}' \
        | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+$' \
        | sort -V |tail -n 1
    transformers:
      - trimprefix: v
      - sort:
          method: semver
    changelog:
      url: "https://git.savannah.gnu.org/cgit/autoconf.git/tree/NEWS"

  automake:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: shell
    spec:
      command: |
        git ls-remote --refs --tags git://git.savannah.gnu.org/automake.git | grep -v '\^{}' \
        | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
        | sort -V |tail -n 1
    transformers:
      - trimprefix: v
      - sort:
          method: semver
    changelog:
      url: "https://git.savannah.gnu.org/cgit/automake.git/tree/NEWS"

  libtool:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: shell
    spec:
      # Somehow they cut the tag 2.6.0 but its marked as alpha?? weird, so exclude it from the results
      command: |
        git ls-remote --refs --tags https://https.git.savannah.gnu.org/git/libtool.git | grep -v '\^{}' \
        | awk -F/ '{print $NF}' \
        | sort -V | grep -v "v2.6" |tail -n 1
    transformers:
      - trimprefix: v
      - sort:
          method: semver
    changelog:
      url: "https://git.savannah.gnu.org/cgit/libtool.git/tree/NEWS"

  cmake:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: shell
    spec:
      command: |
        git ls-remote --refs --tags https://github.com/Kitware/CMake.git | grep -v '\^{}' \
        | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
        | sort -V |tail -n 1
    transformers:
      - trimprefix: v
      - sort:
          method: semver
    changelog:
      url: "https://cmake.org/cmake/help/latest/release/index.html"

  make:
    kind: gittag
    spec:
      url: https://https.git.savannah.gnu.org/git/make.git
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'
    changelog:
      url: "https://git.savannah.gnu.org/cgit/make.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/make.git/diff/?id={new_tag}&id2={old_tag}"

  m4:
    kind: gittag
    spec:
      url: https://https.git.savannah.gnu.org/git/m4.git
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'
    changelog:
      url: "https://git.savannah.gnu.org/cgit/m4.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/m4.git/diff/?id={new_tag}&id2={old_tag}"

  gawk:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: shell
    spec:
      command: |
        git ls-remote --refs --tags https://https.git.savannah.gnu.org/git/gawk.git | grep -v '\^{}' \
        | awk -F/ '{print $NF}' | grep -E '^gawk-[0-9]+\.[0-9]+(\.[0-9]+)?' \
        | sort -V | tail -n 1
    transformers:
      - trimprefix: gawk-
    changelog:
      url: "https://git.savannah.gnu.org/cgit/gawk.git/tree/NEWS"


  binutils:
    # Use lsremote so we only query remote tags instead of cloning the whole repo.
    # binutils tags use underscores (binutils-2_46_1) so we convert them to dots (2.46.1).
    # History: the first release of a series is tagged 2-part (binutils-2_46) but published
    # 3-part (binutils-2.46.0.tar.xz); point releases map directly (binutils-2_46_1 -> 2.46.1).
    # If a future first-of-series 2-part tag becomes the latest, its archive will carry a
    # trailing .0 that this transform won't add and the download will need a manual fixup.
    kind: gittag
    spec:
      url: git://sourceware.org/git/binutils-gdb.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: '^binutils-[0-9]+_[0-9]+(_[0-9]+)?$'
    transformers:
      - trimprefix: binutils-
      - replacer:
          from: '_'
          to: '.'
    changelog:
      url: "https://sourceware.org/git/?p=binutils-gdb.git;a=blob;f=binutils/NEWS;hb=HEAD"

targets:
  flex:
    name: flex version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.flex.version
    sourceid: flex

  bison:
    name: bison version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.bison.version
    sourceid: bison

  autoconf:
    name: autoconf version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.autoconf.version
    sourceid: autoconf

  automake:
    name: automake version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.automake.version
    sourceid: automake

  libtool:
    name: libtool version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.libtool.version
    sourceid: libtool

  cmake:
    name: cmake version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.cmake.version
    sourceid: cmake

  make:
    name: make version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.make.version
    sourceid: make

  m4:
    name: m4 version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.m4.version
    sourceid: m4

  gawk:
    name: gawk version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.gawk.version
    sourceid: gawk

  pkgconfig:
    name: pkgconf version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.pkgconf.version
    sourceid: pkgconfig

  binutils:
    name: binutils version in sources.yaml
    kind: yaml
    spec:
      file: sources.yaml
      key: $.packages.binutils.version
    sourceid: binutils